[package]
name = "phantom_rs"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "phantom_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
numpy = "0.22"
rayon = "1.10"

[profile.release]
lto = true
codegen-units = 1
